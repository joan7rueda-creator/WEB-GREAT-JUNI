<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Great Juni</title>
  <meta name="description" content="Great Juni — marca de ropa streetwear/urbana." />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/landing.css" />
</head>
<body class="is-entering">
  <div class="splash-backdrop" data-parallax-grain aria-hidden="true"></div>
  <div class="grain-blotch" aria-hidden="true"></div>
  <div class="grain" data-parallax-grain aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="splash-scrim" aria-hidden="true"></div>
  <div class="tech-frame" aria-hidden="true"></div>

  <header class="topbar">
    <h1 class="topbar__logo-wrap">
      <img
        class="topbar__logo"
        src="assets/img/logo_great_juni.png"
        alt="Great Juni"
        width="1918"
        height="763"
      />
    </h1>
  </header>

  <main class="splash">
    <div class="splash__stage" data-parallax-stage>
      <nav class="splash__actions" aria-label="Navegación principal">
        <a href="pages/shop.html" class="pill-btn" data-transition>Shop</a>
        <a href="pages/contact.html" class="pill-btn" data-transition>Contact</a>
      </nav>
    </div>
  </main>

  <script src="js/main.js" defer></script>

</html>
