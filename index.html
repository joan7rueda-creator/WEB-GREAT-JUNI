<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Great Juni</title>
  <meta name="description" content="Great Juni — marca de ropa streetwear/urbana." />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/landing.css" />
</head>
<body class="is-entering">
  <div class="splash-backdrop" data-parallax-grain aria-hidden="true"></div>
  <div class="grain-blotch" aria-hidden="true"></div>
  <div class="grain" data-parallax-grain aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="splash-scrim" aria-hidden="true"></div>
  <div class="hero-rules" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <header class="topbar">
    <h1 class="topbar__logo-wrap">
      <img
        class="topbar__logo"
        src="assets/img/logo_great_juni.png"
        alt="Great Juni"
        width="1918"
        height="763"
      />
    </h1>

    <!-- Conector: marcador → línea → bloque de metadata. La línea nace del
         borde del logo y muere en el texto, no es relleno decorativo. -->
    <span class="rail__marker" aria-hidden="true"></span>
    <span class="rail__line" aria-hidden="true"></span>
    <span class="meta-tag" aria-hidden="true">BigSet7</span>
  </header>

  <!-- Divisor entre el área del hero y la fila de metadata inferior. -->
  <div class="hero-footer" aria-hidden="true">
    <span class="hero-footer__rule"></span>
    <div class="hero-footer__row">
      <span class="meta-tag">GJ &middot; 7</span>
      <span class="meta-tag">Barcelona</span>
      <span class="meta-tag">GetYours</span>
    </div>
  </div>

  <main class="splash">
    <div class="splash__stage" data-parallax-stage>
      <a href="pages/shop.html" class="pill-btn splash__cta" data-transition>Shop Now</a>
    </div>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
